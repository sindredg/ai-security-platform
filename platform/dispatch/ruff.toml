# The dispatch step reads what the worker sends back, on the trusted machine,
# so it gets the tool service's rules: bugbear, the security rules, and import
# order.
extend = "../../ruff.toml"

[lint]
extend-select = ["B", "S", "I", "UP"]

[lint.per-file-ignores]
# Tests assert, hold made-up tokens, and start the program under test.
"tests/*" = ["S101", "S105", "S106", "S603"]
