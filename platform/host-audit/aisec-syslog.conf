# The audit daemon's syslog plugin (ADR 0054): every record as one line of
# text to the local6 facility at info. On the orchestrator the log agent
# collects local6 into the workspace's Syslog table; on the worker the lines
# land in the journal, which the orchestrator pulls. The package's own
# syslog.conf stays inactive and unchanged, so an upgrade of auditd never
# stops on a changed configuration file.
active = yes
direction = out
path = /usr/sbin/audisp-syslog
type = always
args = LOG_INFO LOG_LOCAL6
format = string
