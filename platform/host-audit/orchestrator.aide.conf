# AIDE on the orchestrator (ADR 0054). Read by aisec-aide-check and
# aisec-aide-baseline with --config. The package's own configuration is not
# installed: aide comes without aide-common.
@@define DBDIR /var/lib/aisec/aide
database_in=file:@@{DBDIR}/aide.db
database_out=file:@@{DBDIR}/aide.db.new
database_attrs=sha256
report_url=stdout
report_level=changed_attributes
report_summarize_changes=true
log_level=warning

# What is compared for each entry: mode, type, link target, link count, owner,
# group, size, mtime, ctime, a SHA-256, and the extended attributes compiled
# in. Not the inode: a package upgrade replaces files, and an edit in place
# keeps the inode, so it tells nothing the hash does not.
Aisec = p+ftype+l+n+u+g+s+m+c+sha256+X
# A directory's size, times, and link count move with every entry made or
# removed under it, which the report lists on its own. Mode, owner, and
# attributes stay.
Dirs = p+ftype+u+g+X

# The scope: the system's programs and libraries, its configuration, the boot
# files, and the platform's own files. Not /var, /run, /tmp, or the operator's
# home: they change with every job and every session. The directory rule
# comes first at each node, so it wins for a directory.
/boot d Dirs
/boot Aisec
/etc d Dirs
/etc Aisec
/usr/bin d Dirs
/usr/bin Aisec
/usr/sbin d Dirs
/usr/sbin Aisec
/usr/lib d Dirs
/usr/lib Aisec
/usr/local d Dirs
/usr/local Aisec
# The two files K3s's API server reads at start (K.9, the audit policy).
/var/lib/rancher/k3s/server/audit.yaml Aisec
/var/lib/rancher/k3s/server/psa.yaml Aisec

# Left out: files the system rewrites on its own. Each would be a changed
# entry in every report that nobody caused.
!/etc/ld\.so\.cache$
!/etc/\.pwd\.lock$
!/etc/\.updated$
!/etc/adjtime$
!/etc/machine-info$
-/etc/ssl/certs
-/etc/cni
-/usr/local/lib/aisec/__pycache__
# The log agent keeps its working state under its configuration directory:
# tail positions, a database, and the hourly file, each rewritten as it runs.
# The agent's configuration beside them stays in the scope.
-/etc/opt/microsoft/azuremonitoragent/config-cache
