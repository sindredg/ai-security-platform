# AIDE on the worker (ADR 0054). Read by aisec-aide-check and
# aisec-aide-baseline with --config. The package's own configuration is not
# installed: aide comes without aide-common.
@@define DBDIR /var/lib/aisec/aide
database_in=file:@@{DBDIR}/aide.db
database_out=file:@@{DBDIR}/aide.db.new
database_attrs=sha256
report_url=stdout
report_level=changed_attributes
report_summarize_changes=true
log_level=warning

# What is compared for each entry: mode, type, link target, link count, owner,
# group, size, mtime, ctime, a SHA-256, and the extended attributes compiled
# in. Not the inode: a package upgrade replaces files, and an edit in place
# keeps the inode, so it tells nothing the hash does not.
Aisec = p+ftype+l+n+u+g+s+m+c+sha256+X

# The scope: the system's programs and libraries, its configuration, the boot
# files, and the platform's own files. Not /var, /run, /tmp, or the operator's
# home: they change with every job and every session.
/boot Aisec
/etc Aisec
/usr/bin Aisec
/usr/sbin Aisec
/usr/lib Aisec
/usr/local Aisec
# The model server, the agent, the model file, and the fixture (ADR 0015,
# ADR 0030); and the key lines of the three accounts the orchestrator logs in
# to, in homes that are root's (ADR 0019, ADR 0026, ADR 0030).
/opt/aisec Aisec
/home/aisec-job Aisec
/home/aisec-feed Aisec
/home/aisec-logexport Aisec

# Left out: files the system rewrites on its own. Each would be a changed
# entry in every report that nobody caused. The feed account's staging
# directories take the files the orchestrator pushes before an install.
!/etc/ld\.so\.cache$
!/etc/\.pwd\.lock$
!/etc/\.updated$
!/etc/adjtime$
!/etc/machine-info$
-/etc/ssl/certs
-/usr/local/lib/aisec/__pycache__
-/usr/local/lib/aisec/job/__pycache__
-/home/aisec-feed/[a-z-]+$
