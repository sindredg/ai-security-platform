# The service accounts in the two namespaces in namespaces.yaml.
#
# Each default service account mounts no token, as on the namespaces K3s makes
# (check K.6). Kubernetes creates a default account in every new namespace on
# its own, moments after the namespace. Applied in the same call as the
# namespace, this file races that and can fail with AlreadyExists. deploy.sh
# waits for each default account first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tool-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: orchestration
automountServiceAccountToken: false
---
# The account that may register jobs with the tool service. Its token is
# projected into the pod that needs it, with the tool service as its audience,
# never mounted by default. The tool service accepts this account and no other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch
  namespace: orchestration
automountServiceAccountToken: false
