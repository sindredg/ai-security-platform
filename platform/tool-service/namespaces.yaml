# The two namespaces the tool service needs today. Pod Security Admission runs
# both at the restricted level: no root, no privilege escalation, no added
# capabilities, the default seccomp profile, no host ports.
#
# Each default service account mounts no token, as on the namespaces K3s makes
# (check K.6).
apiVersion: v1
kind: Namespace
metadata:
  name: tool-services
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestration
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tool-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: orchestration
automountServiceAccountToken: false
---
# The account that may register jobs with the tool service. Its token is
# projected into the pod that needs it, with the tool service as its audience,
# never mounted by default. The tool service accepts this account and no other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch
  namespace: orchestration
automountServiceAccountToken: false
