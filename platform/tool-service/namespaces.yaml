# The two namespaces the tool service needs today. Pod Security Admission runs
# both at the restricted level: no root, no privilege escalation, no added
# capabilities, the default seccomp profile, no host ports.
#
# The service accounts are in service-accounts.yaml. deploy.sh applies them
# after each namespace has its default account.
apiVersion: v1
kind: Namespace
metadata:
  name: tool-services
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestration
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
