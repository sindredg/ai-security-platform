# Who may do what in orchestration for Argo (ADR 0029).
#
# The controller runs in argo and manages orchestration only. It gets a copy
# of its Role here: argo.yaml has the original, upstream's without secrets,
# and the two must match. Check W.5 compares them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-role
  namespace: orchestration
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, update]
  - apiGroups: [""]
    resources: [pods, pods/exec]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, watch, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, persistentvolumeclaims/finalizers]
    verbs: [create, update, delete, get]
  - apiGroups: [argoproj.io]
    resources: [workflows, workflows/finalizers, workflowtasksets, workflowtasksets/finalizers, workflowartifactgctasks]
    verbs: [get, list, watch, update, patch, delete, create]
  - apiGroups: [argoproj.io]
    resources: [workflowtemplates, workflowtemplates/finalizers]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [list, watch, deletecollection]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [cronworkflows, cronworkflows/finalizers]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-binding
  namespace: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-role
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: argo
---
# The executor's containers in each workflow pod run as this account. They
# record a step's outputs, and may do nothing else: the minimum Argo's
# documentation names. The step's own container runs as dispatch, with no
# token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-executor
  namespace: orchestration
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-executor
  namespace: orchestration
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-executor
  namespace: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-executor
subjects:
  - kind: ServiceAccount
    name: argo-executor
    namespace: orchestration
---
# The executor's token. With automountServiceAccountToken false, the
# controller mounts the token from a secret by this name into the executor's
# containers, not the step's own. Kubernetes no longer makes one, so this
# asks it to. The token does not expire: it ends when the secret is deleted.
# Check W.11.
apiVersion: v1
kind: Secret
metadata:
  name: argo-executor.service-account-token
  namespace: orchestration
  annotations:
    kubernetes.io/service-account.name: argo-executor
type: kubernetes.io/service-account-token
---
# The operator's account for argo and kubectl on the workstation, through the
# SSH tunnel to the API server. Its token is made for 12 hours at a time. It
# starts, reads, stops, and deletes workflows, reads the templates and the
# pods' logs, and nothing else. Templates come from the repository, so it
# cannot change one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-operator
  namespace: orchestration
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-operator
  namespace: orchestration
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [workflowtemplates]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-operator
  namespace: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-operator
subjects:
  - kind: ServiceAccount
    name: argo-operator
    namespace: orchestration
