# One investigation on the worker (ADR 0012, ADR 0030). Submit it by name
# with a task. The controller runs nothing else (ADR 0029):
#
#   argo submit -n orchestration --from workflowtemplate/investigate -p task="..."
#
# A NetBox job is collected on the orchestrator first, and submitted under the
# same name, which is the job's ID (ADR 0040), with the NetBox task:
#
#   sudo collect-netbox-evidence nb-0001
#   argo submit -n orchestration --from workflowtemplate/investigate \
#     --name nb-0001 -p target=netbox -p task="$(cat collectors/netbox/task.txt)"
#
# The dispatch step makes the job's token, registers it, hands the job to the
# worker over SSH, and checks the result. For a NetBox job, the comparison
# step then reads the answer's verdict line for each account, and the checks'
# verdicts for this job alone. Anything but a match fails the step, which
# stops the workflow for the operator (ADR 0041). The exit handler revokes the
# token on success, failure, and stop. One job at a time: the mutex waits for
# the one before. No step is retried.
#
# A workflow may set its own entrypoint. The only templates it can name are
# investigate and the exit handler, which revokes the workflow's own token
# (ADR 0048, platform/argo/tests/lint-entrypoints.sh).
#
# Deadlines, shortest first: the dispatch step's, 180 seconds past the job's
# own limit, then the token's, 300 past it, then the worker unit's 1800. The
# comparison step gets 120 seconds of its own.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: investigate
  namespace: orchestration
spec:
  entrypoint: investigate
  onExit: revoke
  arguments:
    parameters:
      - name: task
      # The tool service's target. A NetBox job's evidence is collected for
      # it first, under the workflow's name (ADR 0040).
      - name: target
        value: synthetic
        enum: [synthetic, netbox]
      - name: max-turns
        value: "6"
      - name: seconds
        value: "600"
  serviceAccountName: dispatch
  automountServiceAccountToken: false
  executor:
    serviceAccountName: argo-executor
  synchronization:
    mutexes:
      - name: worker
  ttlStrategy:
    secondsAfterCompletion: 86400
  securityContext:
    runAsNonRoot: true
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  volumes:
    # The dispatch account's token, for registration only.
    - name: caller-token
      projected:
        sources:
          - serviceAccountToken:
              audience: aisec-tool-service
              expirationSeconds: 600
              path: token
    - name: tool-cert
      configMap:
        name: tool-service-cert
  templates:
    - name: investigate
      # Both steps are inline, so they are not templates a workflow can name
      # as its entrypoint: dispatch alone would end with no comparison, and
      # the comparison alone would read an answer the submitter wrote (#203,
      # ADR 0048). Their nodes have no template name.
      steps:
        - - name: dispatch
            inline:
              # The label the network policies give a way to the worker's SSH
              # port and the tool service's registration port.
              metadata:
                labels:
                  app.kubernetes.io/name: dispatch
              activeDeadlineSeconds: "{{=asInt(workflow.parameters.seconds) + 180}}"
              # On this step only, so the revoke pod's spec does not name the
              # key.
              volumes:
                # The key and the worker's host key. Readable by the step's
                # group only.
                - name: dispatch-ssh
                  secret:
                    secretName: dispatch-ssh
                    defaultMode: 0440
                - name: work
                  emptyDir:
                    medium: Memory
                    sizeLimit: 1Mi
                - name: tmp
                  emptyDir:
                    sizeLimit: 1Mi
              container:
                image: ghcr.io/sindredg/ai-security-platform/dispatch@sha256:3f8d147b9e279b2340ed34e7209216116de07079bdf4cd432e9717fb447a48e5
                # The executor needs the command: it cannot read the image's
                # entry point from a registry it has no way to reach.
                command: [python, /opt/dispatch/dispatch.py]
                args:
                  - dispatch
                  - "{{workflow.name}}"
                  - "{{workflow.parameters.target}}"
                  - "{{workflow.parameters.max-turns}}"
                  - "{{workflow.parameters.seconds}}"
                  - "{{workflow.parameters.task}}"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
                securityContext:
                  runAsUser: 65532
                  runAsGroup: 65532
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                volumeMounts:
                  - name: caller-token
                    mountPath: /var/run/secrets/aisec
                    readOnly: true
                  - name: tool-cert
                    mountPath: /etc/aisec
                    readOnly: true
                  - name: dispatch-ssh
                    mountPath: /etc/dispatch
                    readOnly: true
                  - name: work
                    mountPath: /run/dispatch
                  - name: tmp
                    mountPath: /tmp
              outputs:
                parameters:
                  - name: result
                    valueFrom:
                      path: /tmp/result.json
                      default: "{}"
                  # The comparison's input: written only for an answer of at
                  # most 8 KiB with no template syntax, which Argo would render.
                  - name: answer
                    valueFrom:
                      path: /tmp/answer.txt
                      default: ""
        - - name: compare
            when: "'{{workflow.parameters.target}}' == 'netbox'"
            arguments:
              parameters:
                - name: answer
                  value: "{{steps.dispatch.outputs.parameters.answer}}"
            # No credential and a label no policy names: it reaches the API
            # server for its executor, and nothing else.
            inline:
              metadata:
                labels:
                  app.kubernetes.io/name: compare
              activeDeadlineSeconds: 120
              inputs:
                parameters:
                  - name: answer
              volumes:
                # This job's verdicts and no other job's. Optional, so that a
                # job with none still reaches the step, which stops on it.
                - name: verdicts
                  configMap:
                    name: netbox-verdicts
                    optional: true
                    items:
                      - key: "{{workflow.name}}.json"
                        path: verdicts.json
                - name: tmp
                  emptyDir:
                    sizeLimit: 1Mi
              container:
                image: ghcr.io/sindredg/ai-security-platform/dispatch@sha256:3f8d147b9e279b2340ed34e7209216116de07079bdf4cd432e9717fb447a48e5
                command: [python, /opt/dispatch/compare.py]
                args:
                  - "{{workflow.name}}"
                  - "{{inputs.parameters.answer}}"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
                securityContext:
                  runAsUser: 65532
                  runAsGroup: 65532
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                volumeMounts:
                  - name: verdicts
                    mountPath: /etc/aisec/verdicts
                    readOnly: true
                  - name: tmp
                    mountPath: /tmp
              outputs:
                parameters:
                  - name: comparison
                    valueFrom:
                      path: /tmp/comparison.json
                      default: "{}"
    - name: revoke
      metadata:
        labels:
          app.kubernetes.io/name: dispatch
      container:
        image: ghcr.io/sindredg/ai-security-platform/dispatch@sha256:3f8d147b9e279b2340ed34e7209216116de07079bdf4cd432e9717fb447a48e5
        command: [python, /opt/dispatch/dispatch.py]
        args: [revoke, "{{workflow.name}}"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: caller-token
            mountPath: /var/run/secrets/aisec
            readOnly: true
          - name: tool-cert
            mountPath: /etc/aisec
            readOnly: true
