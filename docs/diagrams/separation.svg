<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="separation-title separation-desc" id="separation-root">
        <title id="separation-title">Two sides, two identities</title>
        <desc id="separation-desc">Architecture diagram showing an operator-run bootstrap root creating a platform side and a target side, each with its own deployment identity, workload resource group, and state account, linked only by a single peering permission on the other side's group.</desc>
        <defs>
      <style>#separation-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #separation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #separation-root .diagram-container { width: 100%; overflow-x: auto; }
      #separation-root .diagram-container { overflow-x: visible; }</style>
          <marker id="separation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="separation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="separation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#separation-dots)"/> after the paper rect to enable. -->
          <!--
          <pattern id="separation-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Zones -->
        <rect x="40" y="168" width="424" height="264" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="170" y="172" width="164" height="12" rx="2" fill="#2d3142"/>
        <text x="252" y="181" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PLATFORM SIDE · SWEDEN CENTRAL</text>
        <rect x="496" y="168" width="424" height="264" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="634" y="172" width="148" height="12" rx="2" fill="#2d3142"/>
        <text x="708" y="181" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TARGET SIDE · DENMARK EAST</text>
        <!-- Bootstrap creates each side -->
        <path d="M 380,96 H 112 Q 104,96 104,104 V 168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#separation-arrow)"/>
        <path d="M 580,96 H 848 Q 856,96 856,104 V 168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#separation-arrow)"/>
        <!-- Each identity on its own side -->
        <line x1="200" y1="264" x2="200" y2="344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#separation-arrow)"/>
        <line x1="304" y1="264" x2="304" y2="344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#separation-arrow)"/>
        <line x1="656" y1="264" x2="656" y2="344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#separation-arrow)"/>
        <line x1="760" y1="264" x2="760" y2="344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#separation-arrow)"/>
        <!-- The one deliberate hole: name the other network as a peering partner -->
        <path d="M 336,216 H 552 Q 560,216 560,224 V 344" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#separation-arrow-accent)"/>
