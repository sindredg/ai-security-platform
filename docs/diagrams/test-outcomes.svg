<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-outcomes-title test-outcomes-desc" id="test-outcomes-root">
        <title id="test-outcomes-title">NetBox jobs at the comparison, by outcome</title>
        <desc id="test-outcomes-desc">Stacked bar chart of the NetBox jobs in each run set that ran the comparison step, from its first live jobs to the scored cases: matches, stops by their cause, and failures.</desc>
        <defs>
      <style>#test-outcomes-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #test-outcomes-root { font-family: var(--font-sans); color: var(--color-ink); }
      #test-outcomes-root .diagram-container { width: 100%; overflow-x: auto; }
      #test-outcomes-root .diagram-container { overflow-x: visible; }</style>
          <marker id="test-outcomes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
