<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root">
        <title id="workflow-title">Investigation to delivery</title>
        <desc id="workflow-desc">Swimlane diagram showing a finding moving through trusted orchestrator steps, one untrusted AI worker step that investigates and proposes, and one operator approval before delivery and verification.</desc>
        <defs>
      <style>#workflow-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #workflow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="workflow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#workflow-dots)"/> after the paper rect to enable. -->
          <!--
          <pattern id="workflow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Lane dividers and label column -->
        <line x1="40" y1="64" x2="920" y2="64" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="1"/>
        <line x1="40" y1="184" x2="920" y2="184" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="1"/>
        <line x1="40" y1="304" x2="920" y2="304" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="1"/>
        <line x1="40" y1="424" x2="920" y2="424" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="1"/>
        <line x1="152" y1="64" x2="152" y2="424" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="1"/>
        <text x="48" y="120" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">OPERATOR</text>
        <text x="48" y="134" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">approves</text>
        <text x="48" y="240" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ORCHESTRATOR</text>
        <text x="48" y="254" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">trusted tools</text>
        <text x="48" y="360" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">AI WORKER</text>
        <text x="48" y="374" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">untrusted</text>
        <!-- Flow -->
        <line x1="272" y1="244" x2="292" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="346" y1="268" x2="346" y2="340" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <path d="M 400,364 H 466 Q 474,364 474,356 V 268" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="528" y1="244" x2="548" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="602" y1="220" x2="602" y2="148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <path d="M 656,124 H 722 Q 730,124 730,132 V 220" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#workflow-arrow-accent)"/>
        <line x1="784" y1="244" x2="804" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <!-- Handoff labels -->
        <rect x="354" y="280" width="60" height="12" rx="2" fill="#2d3142"/>
        <text x="384" y="289" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCOPED JOB</text>
        <rect x="482" y="316" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="508" y="325" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROPOSAL</text>
        <rect x="610" y="160" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="646" y="169" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PULL REQUEST</text>
        <rect x="738" y="156" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="774" y="165" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXACT COMMIT</text>
        <!-- Steps -->
        <rect x="164" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="164" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="218" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect</text>
        <text x="218" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">evidence · checks</text>
        <rect x="292" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="292" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="346" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scope job</text>
        <text x="346" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">target · limits</text>
        <rect x="292" y="340" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="292" y="340" width="108" height="48" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="346" y="362" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Investigate</text>
        <text x="346" y="378" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">propose a change</text>
        <rect x="420" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="420" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="474" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rehearse</text>
        <text x="474" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on a copy · tests</text>
        <rect x="548" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="548" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="602" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Open PR</text>
        <text x="602" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">change + evidence</text>
        <rect x="548" y="100" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="548" y="100" width="108" height="48" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="602" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Approve</text>
        <text x="602" y="138" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">commit + target</text>
        <rect x="676" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="676" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="730" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deliver</text>
        <text x="730" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">re-check · apply</text>
        <rect x="804" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="804" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="858" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Verify</text>
        <text x="858" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fresh collection</text>
        <line x1="40" y1="456" x2="920" y2="456" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="472" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="488" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="60" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Trusted step, fixed and not writable by workers</text>
        <rect x="300" y="488" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="320" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Untrusted step</text>
        <rect x="408" y="488" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="428" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The only approval</text>
        <line x1="536" y1="494" x2="564" y2="494" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <text x="572" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Handoff</text>
        <line x1="648" y1="494" x2="676" y2="494" stroke="#f08a59" stroke-width="1.4" marker-end="url(#workflow-arrow-accent)"/>
        <text x="684" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Approval binds one commit to one target</text>

      </svg>
