<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root">
        <title id="workflow-title">Investigation to delivery</title>
        <desc id="workflow-desc">Swimlane diagram showing a finding moving through trusted orchestrator steps and one untrusted AI worker step, then a comparison of the worker's verdict with the deterministic checks that stops for the operator on anything but a match or on a failed job, and one operator approval before delivery and a fresh collection.</desc>
        <defs>
      <style>#workflow-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #workflow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="workflow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#workflow-dots)"/> after the paper rect to enable. -->
          <!--
          <pattern id="workflow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Lane dividers and label column -->
        <line x1="40" y1="64" x2="1060" y2="64" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="1"/>
        <line x1="40" y1="184" x2="1060" y2="184" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="1"/>
        <line x1="40" y1="304" x2="1060" y2="304" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="1"/>
        <line x1="40" y1="424" x2="1060" y2="424" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="1"/>
        <line x1="152" y1="64" x2="152" y2="424" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="1"/>
        <text x="48" y="120" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">OPERATOR</text>
        <text x="48" y="134" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">looks · approves</text>
        <text x="48" y="240" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ORCHESTRATOR</text>
        <text x="48" y="254" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">trusted tools</text>
        <text x="48" y="360" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">AI WORKER</text>
        <text x="48" y="374" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">untrusted</text>
        <!-- Flow -->
        <line x1="272" y1="244" x2="292" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="346" y1="268" x2="346" y2="340" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <path d="M 400,372 H 486 Q 494,372 494,364 V 268" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <path d="M 400,356 H 412 Q 420,356 420,348 V 132 Q 420,124 428,124 H 440" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="494" y1="220" x2="494" y2="148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="548" y1="244" x2="568" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="676" y1="244" x2="696" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <line x1="750" y1="220" x2="750" y2="148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <path d="M 804,124 H 870 Q 878,124 878,132 V 220" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#workflow-arrow-accent)"/>
        <line x1="932" y1="244" x2="952" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <!-- Handoff labels -->
        <rect x="278" y="280" width="60" height="12" rx="2" fill="#2d3142"/>
        <text x="308" y="289" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCOPED JOB</text>
        <rect x="502" y="316" width="44" height="12" rx="2" fill="#2d3142"/>
        <text x="524" y="325" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER</text>
        <rect x="348" y="152" width="64" height="12" rx="2" fill="#2d3142"/>
        <text x="380" y="161" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAILED JOB</text>
        <rect x="502" y="160" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="530" y="169" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO MATCH</text>
        <rect x="670" y="160" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="706" y="169" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BUNDLE · PR</text>
        <rect x="798" y="160" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="834" y="169" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXACT COMMIT</text>
        <!-- Steps -->
        <rect x="164" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="164" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="218" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect</text>
        <text x="218" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">evidence · checks</text>
        <rect x="292" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="292" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="346" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scope job</text>
        <text x="346" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">target · limits</text>
        <rect x="292" y="340" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="292" y="340" width="108" height="48" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="346" y="362" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Investigate</text>
        <text x="346" y="378" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verdict · proposal</text>
        <rect x="440" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="440" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="494" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Compare</text>
        <text x="494" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verdict vs checks</text>
        <rect x="440" y="100" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="440" y="100" width="108" height="48" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="494" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stop</text>
        <text x="494" y="138" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the operator looks</text>
        <rect x="568" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="568" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="622" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Propose</text>
        <text x="622" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">policy · rehearsal</text>
        <rect x="696" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="696" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="750" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bundle</text>
        <text x="750" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">checked fields</text>
        <rect x="696" y="100" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="696" y="100" width="108" height="48" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="750" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Approve</text>
        <text x="750" y="138" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PR · signed tag</text>
        <rect x="824" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="824" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="878" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deliver</text>
        <text x="878" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tag · token · apply</text>
        <rect x="952" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="952" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="1006" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Check</text>
        <text x="1006" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">both checks · merge</text>
        <line x1="40" y1="456" x2="1060" y2="456" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="472" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="488" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="60" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Trusted step, not writable by workers</text>
        <rect x="300" y="488" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="320" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Untrusted step</text>
        <rect x="440" y="488" width="14" height="10" rx="2" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="460" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">A stop: the operator looks, and the job ends</text>
        <rect x="40" y="506" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="514" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The only approval</text>
        <line x1="300" y1="512" x2="328" y2="512" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workflow-arrow)"/>
        <text x="336" y="514" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Handoff</text>
        <line x1="440" y1="512" x2="468" y2="512" stroke="#f08a59" stroke-width="1.4" marker-end="url(#workflow-arrow-accent)"/>
        <text x="476" y="514" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Approval binds one commit to one target</text>

      </svg>
