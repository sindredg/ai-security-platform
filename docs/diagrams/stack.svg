<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-title stack-desc" id="stack-root">
        <title id="stack-title">The stack on the orchestrator and the worker</title>
        <desc id="stack-desc">Layer stack diagram showing what the orchestrator and the AI worker share, from the private network up through the machine, Ubuntu 26.04, and host hardening, and where they differ: the orchestrator runs K3s with the tool service, is not on the mesh VPN, and has no way out of its own, and the worker runs the model server and the agent runtime and gets packages through the proxy on the edge VM.</desc>
        <defs>
      <style>#stack-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #stack-root { font-family: var(--font-sans); color: var(--color-ink); }
      #stack-root .diagram-container { width: 100%; overflow-x: auto; }
      #stack-root .diagram-container { overflow-x: visible; }</style>
          <marker id="stack-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="stack-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="stack-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#stack-dots)"/> after the paper rect to enable. -->
          <!--
          <pattern id="stack-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Column headers -->
        <text x="344" y="76" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ORCHESTRATOR · TRUSTED</text>
        <text x="728" y="76" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">AI WORKER · UNTRUSTED</text>
        <!-- Bands -->
        <rect x="152" y="88" width="768" height="64" fill="#393e53"/>
        <text x="40" y="124" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L6 WORKLOADS</text>
        <text x="344.0" y="116" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tool service, in K3s</text>
        <text x="344.0" y="134" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Argo Workflows, planned</text>
        <text x="728.0" y="116" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Model server · agent runtime</text>
        <text x="728.0" y="134" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">llama.cpp on loopback · Goose per job</text>
        <line x1="536" y1="88" x2="536" y2="152" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="152" y="152" width="768" height="64" fill="#393e53"/>
        <rect x="152" y="152" width="384" height="64" fill="#2d3142"/>
        <rect x="152" y="152" width="384" height="64" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="40" y="188" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L5 SERVICES</text>
        <text x="344.0" y="180" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">K3s</text>
        <text x="344.0" y="198" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one server · not on the mesh · no way out</text>
        <text x="728.0" y="180" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">apt, through the edge</text>
        <text x="728.0" y="198" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no service listens but SSH</text>
        <line x1="152" y1="152" x2="920" y2="152" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="152" y="216" width="768" height="64" fill="#393e53"/>
        <text x="40" y="252" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L4 HARDENING</text>
        <text x="536.0" y="244" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SSH daemon · kernel settings · file modes · no toolchain</text>
        <text x="536.0" y="262" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the same on every VM, from cloud-init</text>
        <line x1="152" y1="216" x2="920" y2="216" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="152" y="280" width="768" height="64" fill="#393e53"/>
        <text x="40" y="316" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L3 SYSTEM</text>
        <text x="536.0" y="308" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ubuntu 26.04 LTS</text>
        <text x="536.0" y="326" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">x64 and Arm64 · unattended security upgrades</text>
        <line x1="152" y1="280" x2="920" y2="280" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="152" y="344" width="768" height="64" fill="#393e53"/>
        <text x="40" y="380" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L2 MACHINE</text>
        <text x="344.0" y="372" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Standard_B2as_v2</text>
        <text x="344.0" y="390" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2 vCPUs · 8 GiB · Trusted Launch</text>
        <text x="728.0" y="372" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Standard_D2ps_v6</text>
        <text x="728.0" y="390" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2 Arm cores · 8 GiB · Trusted Launch</text>
        <line x1="536" y1="344" x2="536" y2="408" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>
        <line x1="152" y1="344" x2="920" y2="344" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="152" y="408" width="768" height="64" fill="#393e53"/>
        <text x="40" y="444" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L1 NETWORK</text>
        <text x="536.0" y="436" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Private subnets · deny-by-default rules · a NAT gateway</text>
        <text x="536.0" y="454" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no public address on any VM, refused by policy</text>
        <line x1="152" y1="408" x2="920" y2="408" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="152" y="88" width="768" height="384" fill="none" stroke="#bfc0c0" stroke-width="1"/>
        <line x1="40" y1="500" x2="920" y2="500" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="516" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="532" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="540" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Runs only on the trusted VM</text>
        <rect x="208" y="532" width="14" height="10" rx="2" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
        <text x="228" y="540" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Built. A full-width band is the same on both VMs</text>

      </svg>
