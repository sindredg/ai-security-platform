<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-flows-title network-flows-desc" id="network-flows-root">
        <title id="network-flows-title">Network flows</title>
        <desc id="network-flows-desc">Architecture diagram showing every allowed and denied network path on the platform side: the operator reaches the router VM on port 22 over the mesh VPN, the router reaches the orchestrator and the worker on port 22 and the internet through its own NAT gateway, the orchestrator reaches the worker and the targets on port 22 and the internet through its NAT gateway, the worker reaches only the package proxy on port 3128 and the tool service on port 30443, and the worker and the targets are denied everything else.</desc>
        <defs>
      <style>#network-flows-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #network-flows-root { font-family: var(--font-sans); color: var(--color-ink); }
      #network-flows-root .diagram-container { width: 100%; overflow-x: auto; }
      #network-flows-root .diagram-container { overflow-x: visible; }</style>
