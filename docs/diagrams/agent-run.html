<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One agent run on the worker</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Private AI security operations platform</p>
    <h1>One agent run on the worker</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-run-title agent-run-desc">
        <title id="agent-run-title">One agent run on the worker</title>
        <desc id="agent-run-desc">Architecture diagram of one agent run on the AI worker: the task arrives from the operator over SSH on standard input, the job runner starts Goose in a sandboxed transient systemd unit, Goose calls the llama.cpp model server on 127.0.0.1 port 8080 and one fixture tool over standard input and output, and the transcript goes back as one JSON document.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#dots)"/> after the paper rect to enable. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.08)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Zones -->

        <rect x="462" y="60" width="204" height="12" rx="2" fill="#2d3142"/>
        <text x="564" y="69" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">AI WORKER VM · UNTRUSTED · 10.40.0.36</text>
        <rect x="400" y="120" width="240" height="280" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <rect x="446" y="124" width="148" height="12" rx="2" fill="#2d3142"/>
        <text x="520" y="133" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">AISEC-AGENT-JOB · TRANSIENT</text>
        <rect x="672" y="120" width="224" height="152" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>

        <line x1="176" y1="184" x2="232" y2="184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="368" y1="184" x2="424" y2="184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="424" y1="208" x2="368" y2="208" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="232" y1="208" x2="176" y2="208" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Calls the agent makes -->
        <line x1="616" y1="196" x2="696" y2="196" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="520" y1="240" x2="520" y2="304" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Labels -->
        <rect x="184" y="144" width="40" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="153" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SSH 22</text>
        <rect x="190" y="216" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="225" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JSON</text>
        <rect x="378" y="164" width="36" height="12" rx="2" fill="#2d3142"/>
        <text x="396" y="173" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STDIN</text>
        <rect x="376" y="216" width="40" height="12" rx="2" fill="#2d3142"/>

        <rect x="628" y="176" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="656" y="185" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP 8080</text>
        <rect x="532" y="266" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="560" y="275" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MCP STDIO</text>
        <!-- Nodes -->
        <rect x="40" y="164" width="136" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="164" width="136" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <rect x="48" y="172" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
        <text x="64" y="181" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="108" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Operator shell</text>
        <text x="108" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no dispatch yet</text>
        <rect x="232" y="164" width="136" height="64" rx="6" fill="#2d3142"/>
        <rect x="232" y="164" width="136" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="240" y="172" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="256" y="181" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>

        <text x="300" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">run-agent.sh</text>
        <rect x="424" y="152" width="192" height="88" rx="6" fill="#2d3142"/>
        <rect x="424" y="152" width="192" height="88" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <rect x="432" y="160" width="36" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="450" y="169" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="520" y="196" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Goose 1.54.0</text>
        <text x="520" y="212" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one tool · 6 turns at most</text>
        <text x="520" y="226" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2 GB · 15 minutes</text>
        <rect x="424" y="304" width="192" height="64" rx="6" fill="#2d3142"/>
        <rect x="424" y="304" width="192" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="432" y="312" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
        <text x="448" y="321" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="520" y="340" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Evidence fixture</text>
        <text x="520" y="356" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">synthetic evidence</text>
        <rect x="696" y="152" width="176" height="88" rx="6" fill="#2d3142"/>

        <rect x="704" y="160" width="36" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="722" y="169" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>

        <text x="784" y="212" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8080 · one slot</text>
        <text x="784" y="226" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Qwen3.5-4B · Q4_K_M</text>

        <text x="784" y="260" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">same sandbox · 6 GB</text>
        <line x1="40" y1="456" x2="920" y2="456" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The agent, one run per unit</text>
        <rect x="196" y="488" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="216" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Fixture, until Goose uses the service</text>
        <line x1="400" y1="494" x2="428" y2="494" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="436" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Task in, and the tool call</text>
        <line x1="568" y1="494" x2="596" y2="494" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="604" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Transcript out</text>
        <line x1="688" y1="494" x2="716" y2="494" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="724" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Model API, never leaves the worker</text>

      </svg>
    </div>
  </div>
</body>
</html>
