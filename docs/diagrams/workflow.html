<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigation to delivery</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Private AI security operations platform</p>
    <h1>Investigation to delivery</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc">
        <title id="workflow-title">Investigation to delivery</title>
        <desc id="workflow-desc">Swimlane diagram showing a finding moving through trusted orchestrator steps and one untrusted AI worker step, then a comparison of the worker's verdict with the deterministic checks that stops for the operator on anything but a match, and one operator approval before delivery.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#dots)"/> after the paper rect to enable. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.08)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Lane dividers and label column -->
        <line x1="40" y1="64" x2="920" y2="64" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <line x1="40" y1="184" x2="920" y2="184" stroke="rgba(245,245,245,0.10)" stroke-width="1"/>
        <line x1="40" y1="304" x2="920" y2="304" stroke="rgba(245,245,245,0.10)" stroke-width="1"/>
        <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <line x1="152" y1="64" x2="152" y2="424" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="48" y="120" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">OPERATOR</text>
        <text x="48" y="134" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">looks · approves</text>
        <text x="48" y="240" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ORCHESTRATOR</text>
        <text x="48" y="254" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">trusted tools</text>
        <text x="48" y="360" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">AI WORKER</text>
        <text x="48" y="374" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">untrusted</text>
        <!-- Flow -->
        <line x1="272" y1="244" x2="292" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="346" y1="268" x2="346" y2="340" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 400,364 H 466 Q 474,364 474,356 V 268" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="474" y1="220" x2="474" y2="148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="528" y1="244" x2="548" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="656" y1="244" x2="676" y2="244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="730" y1="220" x2="730" y2="148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 784,124 H 850 Q 858,124 858,132 V 220" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Handoff labels -->
        <rect x="354" y="280" width="60" height="12" rx="2" fill="#2d3142"/>
        <text x="384" y="289" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCOPED JOB</text>
        <rect x="482" y="316" width="44" height="12" rx="2" fill="#2d3142"/>
        <text x="504" y="325" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER</text>
        <rect x="482" y="160" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="510" y="169" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO MATCH</text>
        <rect x="650" y="160" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="686" y="169" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PULL REQUEST</text>
        <rect x="778" y="160" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="814" y="169" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXACT COMMIT</text>
        <!-- Steps -->
        <rect x="164" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="164" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="218" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect</text>
        <text x="218" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">evidence · checks</text>
        <rect x="292" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="292" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="346" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scope job</text>
        <text x="346" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">target · limits</text>
        <rect x="292" y="340" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="292" y="340" width="108" height="48" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="346" y="362" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Investigate</text>
        <text x="346" y="378" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verdict · proposal</text>
        <rect x="420" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="420" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="474" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Compare</text>
        <text x="474" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verdict vs checks</text>
        <rect x="420" y="100" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="420" y="100" width="108" height="48" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="474" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stop</text>
        <text x="474" y="138" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the operator looks</text>
        <rect x="548" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="548" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="602" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rehearse</text>
        <text x="602" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on a copy · tests</text>
        <rect x="676" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="676" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="730" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Open PR</text>
        <text x="730" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">change + evidence</text>
        <rect x="676" y="100" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="676" y="100" width="108" height="48" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <text x="730" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Approve</text>
        <text x="730" y="138" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">commit + target</text>
        <rect x="804" y="220" width="108" height="48" rx="6" fill="#2d3142"/>
        <rect x="804" y="220" width="108" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="858" y="242" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deliver</text>
        <text x="858" y="258" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">apply · verify</text>
        <line x1="40" y1="456" x2="920" y2="456" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="488" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="60" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Trusted step, not writable by workers</text>
        <rect x="300" y="488" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="320" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Untrusted step</text>
        <rect x="440" y="488" width="14" height="10" rx="2" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="460" y="496" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">A stop: the operator looks, and the job ends</text>
        <rect x="40" y="506" width="14" height="10" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="514" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The only approval</text>
        <line x1="300" y1="512" x2="328" y2="512" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="336" y="514" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Handoff</text>
        <line x1="440" y1="512" x2="468" y2="512" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="476" y="514" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Approval binds one commit to one target</text>

      </svg>
    </div>
  </div>
</body>
</html>
