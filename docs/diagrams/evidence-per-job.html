<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a job's NetBox evidence goes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Private AI security operations platform</p>
    <h1>Where a job's NetBox evidence goes</h1>
    <div class="diagram-container">

        <desc id="evidence-per-job-desc">Data flow diagram showing the collect command on the orchestrator reading NetBox's configured permissions with its own token and each account's reads through the lab VM's observer account, keeping the verdicts and both reports in the job's directory, writing the verdicts into a config map that only the workflow's comparison step reads, and writing only facts into a config map that the tool service mounts, which hands the AI worker only that job's documents in the fields their schemas name.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

        <line x1="424" y1="168" x2="464" y2="168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="576" y1="168" x2="616" y2="168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="736" y1="168" x2="816" y2="168" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Labels -->
        <rect x="192" y="148" width="64" height="12" rx="2" fill="#2d3142"/>

        <rect x="128" y="242" width="64" height="12" rx="2" fill="#2d3142"/>

        <rect x="204" y="308" width="56" height="12" rx="2" fill="#2d3142"/>

        <rect x="56" y="288" width="128" height="80" rx="6" fill="#2d3142"/>

        <text x="120" y="342" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">lab VM · SSH</text>
        <text x="120" y="356" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">forced command</text>
        <rect x="264" y="128" width="160" height="80" rx="6" fill="#2d3142"/>
        <rect x="264" y="128" width="160" height="80" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <text x="344" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect command</text>
        <text x="344" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">collect-netbox-evidence</text>

        <rect x="304" y="288" width="160" height="80" rx="6" fill="#2d3142"/>

        <text x="384" y="342" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verdicts · both reports</text>
        <text x="384" y="356" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the job never reads it</text>
        <rect x="464" y="128" width="112" height="80" rx="6" fill="#2d3142"/>
        <rect x="464" y="128" width="112" height="80" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="520" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Evidence</text>
        <text x="520" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JOB.ev-000N.json</text>
        <text x="520" y="196" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">facts only</text>
        <rect x="488" y="288" width="112" height="80" rx="6" fill="#2d3142"/>
        <rect x="488" y="288" width="112" height="80" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>

        <rect x="616" y="128" width="120" height="80" rx="6" fill="#2d3142"/>

        <rect x="312" y="456" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="332" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Platform</text>
        <rect x="392" y="456" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>

        <text x="532" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">NetBox's answers</text>
