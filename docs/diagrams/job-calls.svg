<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-calls-title job-calls-desc" id="job-calls-root">
        <title id="job-calls-title">One scored job, call by call</title>
        <desc id="job-calls-desc">Sequence diagram of the scored job nb-10252308-control-only-1: the dispatch step hands the job to the agent on the worker, which asks the tool service for ev-0001, ev-0002, and ev-0003 one at a time and returns its answer, and the comparison step reads its verdict lines and finds a match.</desc>
        <defs>
      <style>#job-calls-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #job-calls-root { font-family: var(--font-sans); color: var(--color-ink); }
      #job-calls-root .diagram-container { width: 100%; overflow-x: auto; }
      #job-calls-root .diagram-container { overflow-x: visible; }</style>
