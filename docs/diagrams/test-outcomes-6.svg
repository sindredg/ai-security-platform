<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-outcomes-6-title test-outcomes-6-desc" id="test-outcomes-6-root">
        <title id="test-outcomes-6-title">NetBox jobs at the comparison in milestone 6, by outcome</title>
        <desc id="test-outcomes-6-desc">Stacked bar chart of the NetBox jobs in each of milestone 6's run sets that ran the comparison step: matches, stops by their cause, and failures.</desc>
        <defs>
      <style>#test-outcomes-6-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #test-outcomes-6-root { font-family: var(--font-sans); color: var(--color-ink); }
      #test-outcomes-6-root .diagram-container { width: 100%; overflow-x: auto; }
      #test-outcomes-6-root .diagram-container { overflow-x: visible; }</style>
          <marker id="test-outcomes-6-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="test-outcomes-6-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="test-outcomes-6-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#test-outcomes-6-dots)"/> after the paper rect to enable. -->
          <!--
          <pattern id="test-outcomes-6-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Gridlines and the axis -->
        <line x1="296" y1="64" x2="296" y2="184" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="1"/>
        <text x="296" y="200" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text>
        <line x1="392" y1="64" x2="392" y2="184" stroke="#f5f5f5" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="392" y="200" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text>
        <line x1="488" y1="64" x2="488" y2="184" stroke="#f5f5f5" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="488" y="200" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text>
        <text x="416" y="216" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">NETBOX JOBS</text>
        <!-- One bar per run set -->
        <text x="280" y="92" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="end">Drills without an apply</text>
        <text x="280" y="105" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">2026-10-28 17:47</text>
        <rect x="296" y="80" width="48" height="28" fill="#2d3142"/>
        <rect x="296" y="80" width="48" height="28" fill="#f08a59" fill-opacity="0.45" stroke="#f08a59" stroke-width="1"/>
        <text x="320" y="97" fill="#f08a59" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <rect x="344" y="80" width="48" height="28" fill="#2d3142"/>
        <rect x="344" y="80" width="48" height="28" fill="#d3ad7a" fill-opacity="0.22" stroke="#d3ad7a" stroke-width="1"/>
        <text x="368" y="97" fill="#d3ad7a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <rect x="392" y="80" width="48" height="28" fill="#2d3142"/>
        <rect x="392" y="80" width="48" height="28" fill="#b88670" fill-opacity="0.22" stroke="#b88670" stroke-width="1"/>
        <text x="416" y="97" fill="#b88670" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <rect x="440" y="80" width="48" height="28" fill="#2d3142"/>
        <rect x="440" y="80" width="48" height="28" fill="#7a96aa" fill-opacity="0.22" stroke="#7a96aa" stroke-width="1"/>
        <text x="464" y="97" fill="#7a96aa" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <rect x="488" y="80" width="48" height="28" fill="#2d3142"/>
        <rect x="488" y="80" width="48" height="28" fill="#a0a0a0" fill-opacity="0.22" stroke="#a0a0a0" stroke-width="1"/>
        <text x="512" y="97" fill="#a0a0a0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <text x="544" y="97" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">5</text>
        <text x="280" y="148" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="end">Forbidden calls from the worker</text>
        <text x="280" y="161" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">2026-10-30 02:39</text>
        <rect x="296" y="136" width="192" height="28" fill="#2d3142"/>
        <rect x="296" y="136" width="192" height="28" fill="#f08a59" fill-opacity="0.45" stroke="#f08a59" stroke-width="1"/>
        <text x="392" y="153" fill="#f08a59" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text>
        <text x="496" y="153" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">4</text>
        <!-- Legend -->
        <line x1="40" y1="240" x2="920" y2="240" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="256" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="272" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.45" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="280" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Match</text>
        <rect x="336" y="272" width="14" height="10" rx="2" fill="#82a0c0" fill-opacity="0.22" stroke="#82a0c0" stroke-width="1"/>
        <text x="356" y="280" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stop: verdicts right, a line unreadable</text>
        <rect x="632" y="272" width="14" height="10" rx="2" fill="#d3ad7a" fill-opacity="0.22" stroke="#d3ad7a" stroke-width="1"/>
        <text x="652" y="280" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stop: a verdict against the checks, or missing</text>
        <rect x="40" y="292" width="14" height="10" rx="2" fill="#8d8298" fill-opacity="0.22" stroke="#8d8298" stroke-width="1"/>
        <text x="60" y="300" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stop: the checks disagree or are missing</text>
        <rect x="336" y="292" width="14" height="10" rx="2" fill="#b88670" fill-opacity="0.22" stroke="#b88670" stroke-width="1"/>
        <text x="356" y="300" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Failed: time limit</text>
        <rect x="632" y="292" width="14" height="10" rx="2" fill="#7a96aa" fill-opacity="0.22" stroke="#7a96aa" stroke-width="1"/>
        <text x="652" y="300" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stopped by the operator</text>
        <rect x="40" y="312" width="14" height="10" rx="2" fill="#a0a0a0" fill-opacity="0.22" stroke="#a0a0a0" stroke-width="1"/>
        <text x="60" y="320" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Failed before the job ran</text>

      </svg>
