        <text x="776" y="157" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIELDS ONLY</text>
        <!-- Nodes -->
        <rect x="56" y="128" width="128" height="80" rx="6" fill="#2d3142"/>
        <rect x="56" y="128" width="128" height="80" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="120" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">NetBox</text>
        <text x="120" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NetBox VM</text>
        <text x="120" y="196" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTTPS 8443</text>
        <rect x="56" y="288" width="128" height="80" rx="6" fill="#2d3142"/>
        <rect x="56" y="288" width="128" height="80" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="120" y="326" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Observer</text>
        <text x="120" y="342" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">lab VM · SSH</text>
        <text x="120" y="356" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">forced command</text>
        <rect x="264" y="128" width="160" height="80" rx="6" fill="#2d3142"/>
        <rect x="264" y="128" width="160" height="80" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="344" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect command</text>
        <text x="344" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">collect-netbox-evidence</text>
        <text x="344" y="196" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">as root, once per job</text>
        <rect x="304" y="288" width="160" height="80" rx="6" fill="#2d3142"/>
        <rect x="304" y="288" width="160" height="80" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="384" y="326" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Job directory</text>
        <text x="384" y="342" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verdicts · both reports</text>
        <text x="384" y="356" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the job never reads it</text>
        <rect x="464" y="128" width="112" height="80" rx="6" fill="#2d3142"/>
        <rect x="464" y="128" width="112" height="80" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="520" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Config map</text>
        <text x="520" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JOB.ev-000N.json</text>
        <text x="520" y="196" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">facts only</text>
        <rect x="616" y="128" width="120" height="80" rx="6" fill="#2d3142"/>
        <rect x="616" y="128" width="120" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="676" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tool service</text>
        <text x="676" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the job's own keys</text>
        <text x="676" y="196" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">schema fields only</text>
        <rect x="816" y="128" width="104" height="80" rx="6" fill="#2d3142"/>
        <rect x="816" y="128" width="104" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="868" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AI worker</text>
        <text x="868" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10.40.0.36</text>
        <text x="868" y="196" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">untrusted</text>
        <line x1="40" y1="424" x2="920" y2="424" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="456" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Collects, as root</text>
        <rect x="160" y="456" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="180" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stored on the orchestrator</text>
        <rect x="312" y="456" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="332" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Platform</text>
        <rect x="392" y="456" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="412" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Target side</text>
        <line x1="496" y1="462" x2="524" y2="462" stroke="#739fdf" stroke-width="1.2" marker-end="url(#evidence-per-job-arrow-link)"/>
        <text x="532" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">NetBox's answers</text>
        <line x1="640" y1="462" x2="668" y2="462" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#evidence-per-job-arrow)"/>
        <text x="676" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Evidence moves</text>
        <line x1="772" y1="462" x2="800" y2="462" stroke="#f08a59" stroke-width="1.4" marker-end="url(#evidence-per-job-arrow-accent)"/>
        <text x="808" y="464" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Reaches the model</text>

      </svg>
