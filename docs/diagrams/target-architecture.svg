<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="target-architecture-title target-architecture-desc" id="target-architecture-root">
        <title id="target-architecture-title">Target architecture</title>
        <desc id="target-architecture-desc">Architecture diagram showing a trusted orchestrator VM as the only link between an untrusted AI worker, two target VMs in a separate network, and the outside world through one NAT gateway, with the worker's route to the targets and the targets' route to the internet blocked.</desc>
        <defs>
      <style>#target-architecture-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #target-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #target-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #target-architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="target-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
