# Version pins are exact, so something has to propose moving them.
#
# Not covered, because Dependabot cannot update any of them. These move by
# hand:
#
# - The Terraform release itself.
# - The scanner and linter image digests in the checks workflow.
# - worker/model-server/pins.env and artifacts.tsv: the llama.cpp build, the
#   model revision, pip, and the converter's wheels, each with a checksum.
#   converter-requirements.txt changes with them, in the same pull request,
#   and the advisory review in docs/security/accepted-risks.md is redone.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The provider pin is the same in every root and in the shared module. One
  # grouped pull request keeps them in step. The target root is in the targets
  # repository, which has its own Dependabot configuration and its own pin.
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/platform
      - /infra/modules/network
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]

  # requirements.txt is compiled from requirements.in with hashes. An update
  # has to move both files, and the pipeline installs with --require-hashes.
  - package-ecosystem: pip
    directory: /tool-service
    schedule:
      interval: weekly
    groups:
      tool-service:
        patterns: ["*"]

  # The base image of the tool service, by digest. The checks workflow names
  # the same digest for the tests, and the pipeline fails until both move.
  - package-ecosystem: docker
    directory: /tool-service
    schedule:
      interval: weekly
