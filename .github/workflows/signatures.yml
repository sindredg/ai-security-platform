# The "Commit signatures" check (ADR 0024): every commit in a pull request is
# signed by a key in .github/allowed_signers.
#
# pull_request_target, not pull_request: the workflow, the script, and the
# allowed signers file come from the base branch, so a pull request cannot
# change the check that judges it. The pull request's commits are fetched as
# data and verified. Nothing from the pull request is checked out or run.
# The cost: a change to this check takes effect only after it merges.
name: signatures

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: signatures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signatures:
    name: Commit signatures
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # The default branch as it is now. Its script and allowed signers judge
      # every pull request, whatever branch it targets, because a token that
      # can create a branch could give that branch its own signers file. The
      # range below leaves out every commit already merged, including ones
      # merged after the pull request was opened.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # The repository is public, so the fetch needs no credential.
      - name: Fetch the pull request's commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "${HEAD_SHA}"

      - name: Verify every commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          .github/scripts/check-signatures.sh
          "${PWD}/.github/allowed_signers" HEAD "${HEAD_SHA}"
