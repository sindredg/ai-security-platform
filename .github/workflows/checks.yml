# Static checks, and the tool service image. This workflow holds no cloud
# credentials and runs no plans. Applies happen on the operator workstation
# from a saved plan. One job may write to the repository's package registry,
# and only on main.
#
# The only action used is pinned by commit. The scanners and linters run as
# container images pinned by digest, so no third-party action runs here.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.16.5"
  TERRAFORM_SHA256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
  # Checkov 3.3.27
  CHECKOV_IMAGE: bridgecrew/checkov@sha256:f73d0af11e7145ba80e4a70fbfce9209d704c0d3583e26e7a725002f40eacd8a
  # Trivy 0.75.0
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  # gitleaks 8.30.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # ShellCheck 0.11.0
  SHELLCHECK_IMAGE: koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  # Ruff 0.17.0
  RUFF_IMAGE: ghcr.io/astral-sh/ruff@sha256:0f9316141d252f8c4de3fb672e8433c1afbf9adb24b877ae887cffa4012d850c
  # hadolint 2.15.1
  HADOLINT_IMAGE: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  # Python 3.15.0 on Alpine 3.24. The tool service's tests run on it, and its
  # image is built from it. tool-service/Dockerfile names the same digest.
  PYTHON_IMAGE: python@sha256:ff4d3c9b1a48f646eedd93182aaea385c7a5452f4c8a8cd7cef686babacf4928
  # ADR 0016: the tool service without its tools stays under this many lines.
  TOOL_SERVICE_LINE_LIMIT: "300"

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" terraform -d "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Format
        run: terraform fmt -check -recursive infra

      - name: Validate
        run: |
          for root in bootstrap platform targets; do
            echo "::group::${root}"
            terraform -chdir="infra/${root}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/${root}" validate
            echo "::endgroup::"
          done

  checkov:
    name: Checkov
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Terraform
        run: >
          docker run --rm --volume "${PWD}:/src:ro" "${CHECKOV_IMAGE}"
          --directory /src/infra --framework terraform
          --skip-download --quiet --compact

  trivy:
    name: Trivy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checks built into the pinned image are used as they are. Without
      # --skip-check-update, a newer bundle is downloaded on every run.
      - name: Scan Terraform and the Dockerfile
        run: |
          docker run --rm --volume "${PWD}:/src:ro" "${TRIVY_IMAGE}" \
            config --skip-check-update --exit-code 1 /src/infra
          # The one suppression has its reason in the ignore file.
          docker run --rm --volume "${PWD}:/src:ro" "${TRIVY_IMAGE}" \
            config --skip-check-update --exit-code 1 \
            --ignorefile /src/tool-service/.trivyignore /src/tool-service/Dockerfile

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout belongs to the runner user and the container runs as
      # another one, so Git has to be told the directory is safe.
      - name: Scan the history
        run: >
          docker run --rm --volume "${PWD}:/repo:ro"
          --env GIT_CONFIG_COUNT=1
          --env GIT_CONFIG_KEY_0=safe.directory
          --env GIT_CONFIG_VALUE_0=/repo
          "${GITLEAKS_IMAGE}"
          git /repo --redact --no-banner

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These scripts run as root on the VMs, and nothing else reads them
      # before they do. The image has no shell, so the runner finds the files.
      # -x follows the "source" of pins.env, which holds no secret.
      - name: Lint the worker and validation scripts
        run: |
          mapfile -t scripts < <(find worker validation -name '*.sh' | sort)
          [ "${#scripts[@]}" -gt 0 ]
          docker run --rm --volume "${PWD}:/mnt:ro" --workdir /mnt "${SHELLCHECK_IMAGE}" \
            -x -P SCRIPTDIR "${scripts[@]}"

  ruff:
    name: Ruff
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ruff.toml sets the line length for every Python file. The worker's
      # files get the default rule set of the pinned release. The tool service
      # adds rules in its own ruff.toml, because it reads hostile input.
      - name: Lint the Python files
        run: >
          docker run --rm --volume "${PWD}:/io:ro" --workdir /io "${RUFF_IMAGE}"
          check --no-cache worker tool-service

      - name: Check the formatting
        run: >
          docker run --rm --volume "${PWD}:/io:ro" --workdir /io "${RUFF_IMAGE}"
          format --no-cache --check worker tool-service

  tool-service:
    name: Tool service tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository is mounted read-only. Every package is installed by hash
      # into a directory inside the container, and nothing else is fetched.
      # The size check runs first: a server over the limit fails before its
      # tests say anything.
      - name: Count the lines and run the tests
        run: |
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src/tool-service \
            --env PYTHONDONTWRITEBYTECODE=1 --env LIMIT="${TOOL_SERVICE_LINE_LIMIT}" \
            "${PYTHON_IMAGE}" sh -ec '
              python count_lines.py "${LIMIT}" aisec_tools/*.py
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --quiet --no-cache-dir --disable-pip-version-check \
                --require-hashes -r requirements.txt -r requirements-dev.txt
              /tmp/venv/bin/python -m pytest -q
            '

  tool-service-image:
    name: Tool service image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The only job that can write anything: the image, to this repository's
    # package registry. The push step runs on main and nowhere else.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/tool-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -i "${HADOLINT_IMAGE}" hadolint - < tool-service/Dockerfile

      - name: Check that the Dockerfile and the tests use one base image
        run: |
          digest="${PYTHON_IMAGE#python@}"
          [ "$(grep -c "^FROM python@${digest}" tool-service/Dockerfile)" = 2 ]

      - name: Build
        run: >
          docker build --pull --no-cache --provenance=false
          --tag "${IMAGE}:${GITHUB_SHA}" tool-service

      # Blocks on any finding with a fix. The tool service's own packages are
      # pinned here and move with the pin. The base image's are Debian's.
      - name: Scan the image
        run: >
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro
          "${TRIVY_IMAGE}" image --scanners vuln --exit-code 1 --ignore-unfixed
          --no-progress "${IMAGE}:${GITHUB_SHA}"

      - name: List what the scan let through
        if: always()
        run: |
          {
            echo '```text'
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
              "${TRIVY_IMAGE}" image --scanners vuln --exit-code 0 --quiet \
              --format table "${IMAGE}:${GITHUB_SHA}" || true
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Push, from main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push --quiet "${IMAGE}:${GITHUB_SHA}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          docker logout ghcr.io
          echo "Pushed \`${digest}\` from commit \`${GITHUB_SHA}\`." | tee -a "${GITHUB_STEP_SUMMARY}"

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reports and never blocks. The versions follow the pins of llama.cpp's
      # converter at one commit, so an advisory in them cannot be fixed here
      # without leaving upstream's list, and a blocking scan would fail every
      # unrelated pull request until upstream moves. The packages run once,
      # during a model build, in a unit with no network and one writable
      # directory. The job still fails if the scanner itself cannot run.
      #
      # Trivy reads pip pins only from a file named requirements.txt, so the
      # file is copied under that name first. This step downloads the
      # vulnerability database, unlike the configuration scan above.
      - name: Scan the converter's packages
        run: |
          mkdir "${RUNNER_TEMP}/deps"
          cp worker/model-server/converter-requirements.txt "${RUNNER_TEMP}/deps/requirements.txt"
          {
            echo '```text'
            docker run --rm --volume "${RUNNER_TEMP}/deps:/deps:ro" "${TRIVY_IMAGE}" \
              fs --scanners vuln --quiet --exit-code 0 /deps
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # This one blocks. The tool service's pins are this project's own, so an
      # advisory in them is fixed by moving the pin. The two files are scanned
      # apart, each under the one name Trivy reads.
      - name: Scan the tool service's packages
        run: |
          for list in requirements requirements-dev; do
            mkdir -p "${RUNNER_TEMP}/tool-service/${list}"
            cp "tool-service/${list}.txt" "${RUNNER_TEMP}/tool-service/${list}/requirements.txt"
            docker run --rm --volume "${RUNNER_TEMP}/tool-service/${list}:/deps:ro" "${TRIVY_IMAGE}" \
              fs --scanners vuln --quiet --exit-code 1 /deps
          done
