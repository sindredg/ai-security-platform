# Static checks, and the tool service image. This workflow holds no cloud
# credentials and runs no plans. Applies happen on the operator workstation
# from a saved plan. One job may write to the repository's package registry,
# and only on main.
#
# The only action used is pinned by commit. The scanners and linters run as
# container images pinned by digest, or, for Terraform and gitleaks, from
# release archives checked against a pinned SHA-256. No third-party action
# runs here.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.0"
  TERRAFORM_SHA256: c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67
  # Checkov 3.3.30
  CHECKOV_IMAGE: bridgecrew/checkov@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
  # Trivy 0.76.1
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  # gitleaks, the release's linux_x64 archive. Its SHA-256 matches the
  # release's checksums file and GitHub's digest of the asset. The binary is
  # static and runs the runner's git. The image ran its own git, linked to an
  # affected musl (issue 155).
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # ShellCheck 0.11.0
  SHELLCHECK_IMAGE: koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  # Ruff 0.17.2
  RUFF_IMAGE: ghcr.io/astral-sh/ruff@sha256:d69a8c8d529a866a6aaea0dfda672693d68671a08827db765514abc1571a78a0
  # kubeconform 0.8.0, and the Kubernetes version its schemas are checked
  # against: the cluster's, from infra/platform/variables.tf.
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  KUBERNETES_VERSION: "1.36.5"
  # Argo's command line v4.1.6, the release the cluster runs (ADR 0029). Its
  # cosign signature was checked against the release's key before it was
  # pinned. It lints the workflow templates offline.
  ARGOCLI_IMAGE: quay.io/argoproj/argocli@sha256:acb4c1de9a9c5fa109fb3094eebbc3eac42d2dd328181b0a395488cc97de75e5
  # hadolint 2.15.1
  HADOLINT_IMAGE: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  # Python 3.15.1 on Alpine 3.24. The tests of the tool service and the
  # dispatch step run on it, and both images are built from it. Both
  # Dockerfiles name the same digest.
  PYTHON_IMAGE: python@sha256:54448f67d7c31c39e5cdd3ea2d6382395ce142806c284425f8e897d78a0465b3
  # The Python release the VMs run their host units with: Ubuntu 26.04's
  # python3. This runner is the same Ubuntu release, so its python3 is the
  # same package. The host suites run on it, and fail when it is another
  # release (issue 168).
  HOST_PYTHON: "3.14"
  # ADR 0016: the tool service without its tools stays under this many lines.
  TOOL_SERVICE_LINE_LIMIT: "300"

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" terraform -d "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Format
        run: terraform fmt -check -recursive infra

      # The target root is in the targets repository, with its own pipeline
      # (ADR 0024).
      - name: Validate
        run: |
          for root in bootstrap platform; do
            echo "::group::${root}"
            terraform -chdir="infra/${root}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/${root}" validate
            echo "::endgroup::"
          done

      # The network module's refusals, against a mocked provider. Checkov does
      # not read the rules the module builds (issue 99).
      - name: Test the network module
        run: |
          terraform -chdir=infra/modules/network init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/modules/network test

  checkov:
    name: Checkov
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Terraform
        run: >
          docker run --rm --volume "${PWD}:/src:ro" "${CHECKOV_IMAGE}"
          --directory /src/infra --framework terraform
          --skip-download --quiet --compact

      - name: Scan the Kubernetes manifests
        run: >
          docker run --rm --volume "${PWD}:/src:ro" "${CHECKOV_IMAGE}"
          --directory /src/platform --framework kubernetes
          --skip-download --quiet --compact

  trivy:
    name: Trivy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checks built into the pinned image are used as they are. Without
      # --skip-check-update, a newer bundle is downloaded on every run.
      - name: Scan Terraform, the manifests, and the Dockerfiles
        run: |
          docker run --rm --volume "${PWD}:/src:ro" "${TRIVY_IMAGE}" \
            config --skip-check-update --exit-code 1 /src/infra
          # The registry list for KSV-0125 is in the data file, with its reason.
          # The findings accepted on the Argo controller's Role are in its
          # ignore file, each limited to the Role's two files, with its reason.
          # The dispatch Dockerfile is scanned on its own below.
          docker run --rm --volume "${PWD}:/src:ro" "${TRIVY_IMAGE}" \
            config --skip-check-update --exit-code 1 \
            --config-data /src/.github/trivy-data \
            --ignorefile /src/platform/argo/.trivyignore.yml \
            --skip-files /src/platform/dispatch/Dockerfile /src/platform
          # Each Dockerfile's one suppression has its reason in its ignore file.
          docker run --rm --volume "${PWD}:/src:ro" "${TRIVY_IMAGE}" \
            config --skip-check-update --exit-code 1 \
            --ignorefile /src/tool-service/.trivyignore /src/tool-service/Dockerfile
          docker run --rm --volume "${PWD}:/src:ro" "${TRIVY_IMAGE}" \
            config --skip-check-update --exit-code 1 \
            --ignorefile /src/platform/dispatch/.trivyignore /src/platform/dispatch/Dockerfile

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p bin
          tar -xzf "${tarball}" -C bin gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # When git fails, gitleaks logs the error, scans no commits, reports no
      # leaks, and exits 0. So an error in its log, or no commit scanned, fails
      # the step as well.
      - name: Scan the history
        run: |
          log="${RUNNER_TEMP}/gitleaks.log"
          status=0
          gitleaks git . --redact --no-banner --no-color 2> "${log}" || status=$?
          cat "${log}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if grep -q ' ERR ' "${log}"; then
            echo "::error::gitleaks logged an error"
            exit 1
          fi
          if ! grep -Eq ' INF [1-9][0-9]* commits scanned' "${log}"; then
            echo "::error::gitleaks scanned no commits"
            exit 1
          fi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These scripts run as root on the VMs, and nothing else reads them
      # before they do. The image has no shell, so the runner finds the files.
      # -x follows the "source" of pins.env, which holds no secret. A script
      # that runs by its own name has no extension, so a file is a script when
      # it ends in .sh or its first line starts a shell.
      # .github/scripts holds the signature check and the renderer below.
      - name: Lint the worker, platform, edge, collector, validation, and pipeline scripts
        run: |
          mapfile -t scripts < <(find worker platform edge collectors validation .github/scripts -type f |
            while read -r file; do
              case "$file" in
                *.sh) echo "$file" ;;
                *) head -n 1 "$file" | grep -qE '^#!.*[/ ](ba|da)?sh([[:space:]]|$)' && echo "$file" ;;
              esac
            done | sort)
          [ "${#scripts[@]}" -gt 0 ]
          printf '%s\n' "${scripts[@]}"
          docker run --rm --volume "${PWD}:/mnt:ro" --workdir /mnt "${SHELLCHECK_IMAGE}" \
            -x -P SCRIPTDIR "${scripts[@]}"

      # The first-boot scripts are written inline in the cloud-init templates,
      # with template expressions in them. Terraform renders each one with
      # placeholder values, and ShellCheck reads the result.
      - name: Install Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" terraform -d "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Lint the first-boot scripts in the cloud-init templates
        run: |
          .github/scripts/render-first-boot.sh "${RUNNER_TEMP}/first-boot"
          mapfile -t scripts < <(find "${RUNNER_TEMP}/first-boot" -name '*.sh' | sort)
          [ "${#scripts[@]}" -gt 0 ]
          docker run --rm --volume "${RUNNER_TEMP}/first-boot:/mnt:ro" --workdir /mnt \
            "${SHELLCHECK_IMAGE}" "${scripts[@]##*/}"

  squid:
    name: Squid configuration
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The edge installs Squid from the Ubuntu archive at first boot, without
      # a pin (ADR 0011). The runner runs the same release, so the parser here
      # is the one the edge gets, as long as both are up to date.
      - name: Install Squid and Terraform
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q squid
          squid -v | head -n 1
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" terraform -d "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # The configuration as the edge template writes it, with placeholder
      # addresses, and the two files it reads in the places it names. Squid
      # parses it with the fetch window closed and open. A warning fails the
      # step too: two overlapping names in the host list only warn.
      - name: Parse the configuration
        run: |
          conf="${RUNNER_TEMP}/squid.conf"
          .github/scripts/render-cloud-init-file.sh edge /etc/squid/squid.conf >"${conf}"
          sudo install -m 0644 edge/fetch-hosts /etc/squid/aisec-fetch-hosts
          sudo install -d -m 0755 /run/aisec
          rule=$(sed -n "s/^rule='\(.*\)'$/\1/p" edge/aisec-fetch-window)
          [ -n "${rule}" ]
          for window in "" "${rule}"; do
            printf '%s\n' "${window}" | sudo tee /run/aisec/fetch-window.conf >/dev/null
            echo "::group::window: ${window:-closed}"
            out=$(sudo squid -k parse -f "${conf}" 2>&1)
            printf '%s\n' "${out}"
            echo "::endgroup::"
            if grep -Eq 'WARNING|ERROR|FATAL' <<<"${out}"; then exit 1; fi
          done

  ruff:
    name: Ruff
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ruff.toml sets the line length for every Python file. The worker's
      # files get the default rule set of the pinned release. The tool service
      # and the collectors add rules in their own ruff.toml, because they read
      # hostile input.
      - name: Lint the Python files
        run: >
          docker run --rm --volume "${PWD}:/io:ro" --workdir /io "${RUFF_IMAGE}"
          check --no-cache worker platform tool-service collectors validation

      - name: Check the formatting
        run: >
          docker run --rm --volume "${PWD}:/io:ro" --workdir /io "${RUFF_IMAGE}"
          format --no-cache --check worker platform tool-service collectors validation

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every manifest against the schemas of the cluster's Kubernetes release,
      # strictly: a field the schema does not name is an error. The schemas
      # are downloaded from the kubeconform project at run time. Argo's
      # workflow templates have no schema there, and are linted below.
      - name: Validate the manifests
        run: |
          mapfile -t manifests < <(find platform -name '*.yaml' | sort)
          [ "${#manifests[@]}" -gt 0 ]
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src "${KUBECONFORM_IMAGE}" \
            -strict -summary -skip WorkflowTemplate -kubernetes-version "${KUBERNETES_VERSION}" "${manifests[@]}"

      # Argo's own linter, offline and strict: an unknown field, or a template
      # that names one that does not exist, fails.
      - name: Lint the workflow templates
        run: |
          mapfile -t templates < <(grep -l '^kind: WorkflowTemplate$' -r platform --include='*.yaml' | sort)
          [ "${#templates[@]}" -gt 0 ]
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src "${ARGOCLI_IMAGE}" \
            lint --offline --no-color --kinds=workflowtemplates "${templates[@]}"

      # Every image line names a digest. A tag alone fails, and so does the
      # placeholder of zeros the manifest held before the first image existed.
      - name: Check that every manifest image is pinned by digest
        run: |
          mapfile -t images < <(grep -rhE '^ *image:' platform --include='*.yaml')
          [ "${#images[@]}" -gt 0 ]
          printf '%s\n' "${images[@]}"
          for line in "${images[@]}"; do
            grep -Eq '@sha256:[0-9a-f]{64}$' <<< "${line}"
            if grep -Eq '@sha256:0{64}$' <<< "${line}"; then exit 1; fi
          done

  tool-service:
    name: Tool service tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository is mounted read-only. Every package is installed by hash
      # into a directory inside the container, and nothing else is fetched.
      # The size check runs first: a server over the limit fails before its
      # tests say anything.
      - name: Count the lines and run the tests
        run: |
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src/tool-service \
            --env PYTHONDONTWRITEBYTECODE=1 --env LIMIT="${TOOL_SERVICE_LINE_LIMIT}" \
            "${PYTHON_IMAGE}" sh -ec '
              python count_lines.py "${LIMIT}" aisec_tools/*.py
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --quiet --no-cache-dir --disable-pip-version-check \
                --require-hashes -r requirements.txt -r requirements-dev.txt
              /tmp/venv/bin/python -m pytest -q
            '

  log-copier-tests:
    name: Log copier tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The copiers run on the orchestrator with Ubuntu's python3, so the
      # tests run with the runner's. -S leaves Ubuntu's own packages off the
      # path, so a test that needs anything outside the standard library fails.
      - name: Run the tests on the host's Python
        run: |
          version=$(/usr/bin/python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')
          echo "Host Python: ${version}" | tee -a "${GITHUB_STEP_SUMMARY}"
          [ "${version%.*}" = "${HOST_PYTHON}" ]
          cd platform/logs
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -m unittest discover -s tests -v

  collector-tests:
    name: Collector tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NetBox's collector runs with Ubuntu's python3 on the orchestrator and
      # the lab VM, so the tests run with the runner's, as the copiers' do.
      - name: Run the tests on the host's Python
        run: |
          version=$(/usr/bin/python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')
          echo "Host Python: ${version}" | tee -a "${GITHUB_STEP_SUMMARY}"
          [ "${version%.*}" = "${HOST_PYTHON}" ]
          cd collectors/netbox
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -m unittest discover -s tests -v

  dispatch-tests:
    name: Dispatch tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both sides of dispatch use the standard library only, so nothing is
      # installed. The worker runs its side with Ubuntu's python3, so its tests
      # run with the runner's, as the log copiers' do. The dispatch image has
      # 3.15, as the pinned image does, so the dispatch step's tests run there.
      # They run the real job runner and job program behind a fake ssh, with a
      # fake Goose and stubs for registration and the model server. The
      # worker's directory also tests the model comparison's measure.py against
      # a stub model server.
      - name: Test the worker's side on the host's Python
        run: |
          version=$(/usr/bin/python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')
          echo "Host Python: ${version}" | tee -a "${GITHUB_STEP_SUMMARY}"
          [ "${version%.*}" = "${HOST_PYTHON}" ]
          cd worker/agent-runtime/job
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -m unittest discover -s tests -v

      - name: Test the dispatch step against it
        run: |
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src/platform/dispatch \
            --env PYTHONDONTWRITEBYTECODE=1 "${PYTHON_IMAGE}" \
            python -m unittest discover -s tests -v

  evidence-pages:
    name: Evidence pages
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The test evidence pages in docs/evidence/ are generated from their
      # records. The record builder and the page generator use the standard
      # library only, so nothing is installed. A page that differs from its
      # record, a record that holds something not to publish, a lesson that
      # names a missing job, or a page that breaks the page rules fails here.
      - name: Test the record builder and the page generator
        run: |
          cd validation/evidence
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -m unittest discover -s tests -v

      - name: Check that each page matches its record
        run: PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S validation/evidence/render.py --check

      # The same page rules on each living page cut to their shape. A page
      # joins the list when it is cut.
      - name: Check the page rules on the living pages
        run: |
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S validation/evidence/render.py \
            --rules README.md docs/architecture.md docs/roadmap.md \
            docs/security/threat-model.md docs/security/ai-threats.md

  tool-service-image:
    name: Tool service image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The only job that can write anything: the image, to this repository's
    # package registry. The push step runs on main and nowhere else.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/tool-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -i "${HADOLINT_IMAGE}" hadolint - < tool-service/Dockerfile

      - name: Check that the Dockerfile and the tests use one base image
        run: |
          digest="${PYTHON_IMAGE#python@}"
          [ "$(grep -c "^FROM python@${digest}" tool-service/Dockerfile)" = 2 ]

      - name: Build
        run: >
          docker build --pull --no-cache --provenance=false
          --tag "${IMAGE}:${GITHUB_SHA}" tool-service

      # Blocks on any finding with a fix. The tool service's own packages are
      # pinned here and move with the pin. The base image's are Debian's.
      - name: Scan the image
        run: >
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro
          "${TRIVY_IMAGE}" image --scanners vuln --exit-code 1 --ignore-unfixed
          --no-progress "${IMAGE}:${GITHUB_SHA}"

      - name: List what the scan let through
        if: always()
        run: |
          {
            echo '```text'
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
              "${TRIVY_IMAGE}" image --scanners vuln --exit-code 0 --quiet \
              --format table "${IMAGE}:${GITHUB_SHA}" || true
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Push, from main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push --quiet "${IMAGE}:${GITHUB_SHA}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          docker logout ghcr.io
          echo "Pushed \`${digest}\` from commit \`${GITHUB_SHA}\`." | tee -a "${GITHUB_STEP_SUMMARY}"

  dispatch-image:
    name: Dispatch image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Writes one image to this repository's package registry, as the tool
    # service image job does. The push step runs on main and nowhere else.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -i "${HADOLINT_IMAGE}" hadolint - < platform/dispatch/Dockerfile

      - name: Check that the Dockerfile and the tests use one base image
        run: |
          digest="${PYTHON_IMAGE#python@}"
          [ "$(grep -c "^FROM python@${digest}" platform/dispatch/Dockerfile)" = 1 ]

      - name: Build
        run: >
          docker build --pull --no-cache --provenance=false
          --tag "${IMAGE}:${GITHUB_SHA}" platform/dispatch

      # ssh refuses to start for a user it cannot look up. -G reads the
      # configuration for the worker as the image's user, without connecting.
      - name: Check that ssh runs as the image's user
        run: |
          docker run --rm --entrypoint /usr/bin/ssh "${IMAGE}:${GITHUB_SHA}" \
            -G aisec-job@10.40.0.36 | grep -x 'user aisec-job'

      # The comparison step's command runs this file, and a missing copy would
      # show only when a workflow runs. Without a job and an answer it prints
      # its usage and exits 2.
      - name: Check that the comparison runs in the image
        run: |
          code=0
          docker run --rm --entrypoint python "${IMAGE}:${GITHUB_SHA}" \
            /opt/dispatch/compare.py || code=$?
          [ "${code}" = 2 ]

      # Blocks on any finding with a fix. OpenSSH's client is Alpine's and
      # moves with the index, the rest with the base image's pin.
      - name: Scan the image
        run: >
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro
          "${TRIVY_IMAGE}" image --scanners vuln --exit-code 1 --ignore-unfixed
          --no-progress "${IMAGE}:${GITHUB_SHA}"

      - name: List what the scan let through
        if: always()
        run: |
          {
            echo '```text'
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
              "${TRIVY_IMAGE}" image --scanners vuln --exit-code 0 --quiet \
              --format table "${IMAGE}:${GITHUB_SHA}" || true
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Push, from main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push --quiet "${IMAGE}:${GITHUB_SHA}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          docker logout ghcr.io
          echo "Pushed \`${digest}\` from commit \`${GITHUB_SHA}\`." | tee -a "${GITHUB_STEP_SUMMARY}"

  converter-dependencies:
    name: Converter dependency scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reports and never blocks, and the ruleset does not require it. The
      # versions follow the pins of llama.cpp's converter at one commit, so an
      # advisory in them cannot be fixed here without leaving upstream's list,
      # and a blocking scan would fail every unrelated pull request until
      # upstream moves. The packages run once,
      # during a model build, in a unit with no network and one writable
      # directory. The job still fails if the scanner itself cannot run.
      #
      # Trivy reads pip pins only from a file named requirements.txt, so the
      # file is copied under that name first. This step downloads the
      # vulnerability database, unlike the configuration scan above.
      - name: Scan the converter's packages
        run: |
          mkdir "${RUNNER_TEMP}/deps"
          cp worker/model-server/converter-requirements.txt "${RUNNER_TEMP}/deps/requirements.txt"
          {
            echo '```text'
            docker run --rm --volume "${RUNNER_TEMP}/deps:/deps:ro" "${TRIVY_IMAGE}" \
              fs --scanners vuln --quiet --exit-code 0 /deps
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

  tool-service-dependencies:
    name: Tool service dependency scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This one blocks, and the ruleset requires it (issue 167). The tool
      # service's pins are this project's own, so an advisory in them is fixed
      # by moving the pin. Unlike the image scan, it covers the development
      # packages and findings without a fix. The two files are scanned apart,
      # each under the one name Trivy reads.
      - name: Scan the tool service's packages
        run: |
          for list in requirements requirements-dev; do
            mkdir -p "${RUNNER_TEMP}/tool-service/${list}"
            cp "tool-service/${list}.txt" "${RUNNER_TEMP}/tool-service/${list}/requirements.txt"
            docker run --rm --volume "${RUNNER_TEMP}/tool-service/${list}:/deps:ro" "${TRIVY_IMAGE}" \
              fs --scanners vuln --quiet --exit-code 1 /deps
          done
